name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          set +e
          npm install --legacy-peer-deps > install.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|ETARGET|notarget|ERESOLVE" install.txt | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=npm install failed::$msg"
            exit 1
          fi

      - name: Align versions with Expo SDK
        run: |
          set +e
          npx expo install --fix -- --legacy-peer-deps > fix.txt 2>&1
          d=$(git diff package.json | grep '^[+-] ' | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Version changes by expo install --fix::${d:-none}"

      - name: Unit tests
        continue-on-error: true
        run: |
          set +e
          npx jest --ci > jest.txt 2>&1
          code=$?
          msg=$(tail -40 jest.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ $code -ne 0 ]; then echo "::warning title=Jest failed::$msg"; else echo "::notice title=Jest OK::tests passed"; fi

      - name: Metro bundle check
        run: |
          set +e
          npx expo export --platform android > bundle.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -v "^$" bundle.txt | tail -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Metro bundle failed::$msg"
            exit 1
          fi
          echo "::notice title=Metro bundle OK::JS bundle compiled"

      - name: Generate native Android project
        run: |
          set +e
          npx expo prebuild --platform android --no-install > prebuild.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -v "^$" prebuild.txt | tail -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Prebuild failed::$msg"
            exit 1
          fi

      - name: Build release APK
        run: |
          set +e
          cd android
          ./gradlew assembleRelease --no-daemon --console=plain > ../gradle.txt 2>&1
          code=$?
          cd ..
          if [ $code -ne 0 ]; then
            msg=$(grep -E "What went wrong|error:|ERROR:|Execution failed|not found|FAILED" -A2 gradle.txt | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi
          echo "::notice title=APK built::assembleRelease succeeded"

      - uses: actions/upload-artifact@v4
        with:
          name: TaskReminder-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish download link (GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TaskReminder.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest TaskReminder.apk \
            --title "Task Reminder (última versión)" \
            --notes "APK compilado automáticamente desde el commit ${GITHUB_SHA::7}. Descárgalo e instálalo encima de la versión anterior." \
            --latest
          echo "::notice title=Download::https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/TaskReminder.apk"
